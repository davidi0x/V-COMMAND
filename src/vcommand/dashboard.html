<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V/COMMAND</title>
<style>
@font-face { font-family: "Archivo"; src: url("/assets/archivo-latin.woff2") format("woff2"); font-weight: 100 900; font-display: swap;
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Archivo"; src: url("/assets/archivo-latin-ext.woff2") format("woff2"); font-weight: 100 900; font-display: swap;
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

:root {
  color-scheme: light;
  --page: #ecedf4; --card: #ffffff; --card-2: #f4f4f9; --line: #e3e3ec;
  --ink: #000000; --ink-2: #3f3e4a; --ink-3: #6d6c78;
  --violet: #8e7bf6; --yellow: #f6e37c; --coral: #f8896b; --lime: #d5f48a;
  --violet-soft: #e4dffd; --good: #22b14c; --bad: #e5484d; --warn: #f2a516;
  --on-color: #000000; --bar: #000000; --bar-ink: #ffffff;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --r-card: 30px; --r-inner: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #121218; --card: #1d1d26; --card-2: #262631; --line: #2f2f3b;
    --ink: #ffffff; --ink-2: #c9c8d6; --ink-3: #9a99a8; --violet-soft: #2c2650;
    --bar: #000000; --bar-ink: #ffffff;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121218; --card: #1d1d26; --card-2: #262631; --line: #2f2f3b;
  --ink: #ffffff; --ink-2: #c9c8d6; --ink-3: #9a99a8; --violet-soft: #2c2650;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--ink); font: 450 15px/1.45 "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
       -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; border-radius: 10px; }
.ic { width: 18px; height: 18px; flex: none; vertical-align: -3px; }
h2 .ic { width: 0.8em; height: 0.8em; vertical-align: -0.05em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- top bar ---------- */
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 22px 40px 8px; }
.logo { font-weight: 900; font-size: 30px; letter-spacing: -0.04em; line-height: 1; display: flex; align-items: center; gap: 2px; }
.logo svg { width: 34px; height: 30px; }
.seg { position: relative; display: inline-flex; background: var(--card-2); border-radius: 999px; padding: 5px; }
.seg button { position: relative; z-index: 1; padding: 9px 30px; border-radius: 999px; font-weight: 550; color: var(--ink-2);
              transition: color 200ms ease; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg .pill { position: absolute; top: 5px; bottom: 5px; left: 0; border-radius: 999px; background: var(--card);
             box-shadow: 0 1px 2px rgba(0,0,0,.06); transition: transform 280ms var(--ease-in-out), width 280ms var(--ease-in-out); }
.project { justify-self: end; display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px;
           background: var(--card); border: 1px solid var(--line); font-weight: 600; max-width: 280px; }
.project span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tools { justify-self: end; display: flex; gap: 10px; align-items: center; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }

nav.tabs { position: relative; display: flex; gap: 2px; margin: 14px auto 0; width: max-content; max-width: calc(100% - 32px);
           background: var(--card-2); border-radius: 999px; padding: 5px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { position: relative; z-index: 1; display: inline-flex; gap: 8px; align-items: center; padding: 10px 18px; border-radius: 999px;
                  color: var(--ink-2); font-weight: 500; white-space: nowrap; transition: color 200ms ease; }
nav.tabs button svg { width: 18px; height: 18px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 650; }
nav.tabs .pill { position: absolute; top: 5px; bottom: 5px; left: 0; border-radius: 999px; background: var(--card);
                 box-shadow: 0 1px 2px rgba(0,0,0,.06); transition: transform 300ms var(--ease-in-out), width 300ms var(--ease-in-out); }

main { flex: 1 0 auto; width: 100%; max-width: 1520px; margin: 0 auto; padding: 0 40px; view-transition-name: page; }
h1.hero { font-weight: 900; font-size: clamp(48px, 7.4vw, 112px); line-height: .88; letter-spacing: -0.055em; margin: 34px 0 26px; max-width: 14ch; }
h1.hero .line { display: block; overflow: hidden; padding-bottom: .06em; }
h1.hero .line > span { display: inline-block; }

/* ---------- cards ---------- */
.bento { display: grid; gap: 18px; grid-template-columns: repeat(12, 1fr); align-items: stretch; }
.card { position: relative; background: var(--card); border-radius: var(--r-card); padding: 30px; overflow: hidden; min-width: 0; }
.card.violet { background: var(--violet); color: #000; } .card.yellow { background: var(--yellow); color: #000; }
.card.coral { background: var(--coral); color: #000; } .card.lime { background: var(--lime); color: #000; }
.card.violet, .card.yellow, .card.coral, .card.lime { --ink: #000; --ink-2: #1d1b29; --ink-3: #3a3846; --line: rgba(0,0,0,.12); }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; }
.c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
.card h2 { font-weight: 850; font-size: 32px; letter-spacing: -0.035em; line-height: 1; margin: 0 0 8px; }
.card h2.big { font-size: clamp(40px, 4.4vw, 68px); letter-spacing: -0.05em; line-height: .92; }
.card h3 { font-weight: 750; font-size: 19px; letter-spacing: -0.015em; margin: 0 0 4px; }
.card p { margin: 0; color: var(--ink-2); }
.kicker { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--ink-2); margin-bottom: 14px; }
.inset { background: rgba(255,255,255,.92); color: #000; border-radius: var(--r-inner); padding: 18px 20px; --ink: #000; --ink-2: #3f3e4a; --ink-3: #6d6c78; --line: #ececf2; }
.card:not(.violet):not(.yellow):not(.coral):not(.lime) .inset { background: var(--card-2); color: var(--ink); }
.row { display: flex; align-items: center; gap: 14px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.stack > * + * { margin-top: 14px; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.giant { font-weight: 900; font-size: clamp(54px, 6vw, 92px); letter-spacing: -0.06em; line-height: .9; }
.list > .item { padding: 14px 0; border-bottom: 1px solid var(--line); }
.list > .item:last-child { border-bottom: 0; }
.badge { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 999px; font-weight: 600; font-size: 13px;
         background: rgba(255,255,255,.85); color: #000; white-space: nowrap; }
.badge .dot, .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.good { background: var(--good); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
.badge.good { background: #e3f8e8; } .badge.bad { background: #ffe1df; } .badge.warn { background: #fff1cc; }
.chip { display: inline-block; padding: 4px 11px; border-radius: 999px; background: rgba(0,0,0,.06); font-size: 13px; margin: 0 6px 6px 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 24px; border-radius: 999px; font-weight: 650;
       background: #000; color: #fff; transition: transform 160ms var(--ease-out), background-color 200ms ease; }
.btn.ghost { background: rgba(0,0,0,.07); color: inherit; }
.btn.light { background: #fff; color: #000; }
.btn.small { padding: 9px 16px; font-size: 14px; }
.btn:active, .icon-btn:active, .opt:active, .seg button:active { transform: scale(0.97); }
.btn svg { width: 18px; height: 18px; }
@media (hover: hover) and (pointer: fine) {
  .btn:hover { background: #26252f; } .btn.ghost:hover { background: rgba(0,0,0,.12); } .btn.light:hover { background: #f1f1f5; }
  nav.tabs button:hover, .seg button:hover { color: var(--ink); }
}
input[type=range] { width: 100%; accent-color: #000; height: 28px; cursor: pointer; }
.sliderrow { display: grid; grid-template-columns: minmax(90px, 140px) 1fr 56px; gap: 14px; align-items: center; padding: 10px 0; }
.sliderrow b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sliderrow output { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.diff { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; background: rgba(0,0,0,.1); }
.diff.hard { background: #000; color: #fff; } .diff.easy { background: rgba(0,0,0,.06); }
.est { font-variant-numeric: tabular-nums; }
select.mini { height: 38px; border-radius: 12px; border: 1px solid var(--line); padding: 0 10px; background: #fff; color: #000; max-width: 170px; }
input.field, select.field { width: 100%; height: 52px; padding: 0 18px; border-radius: 16px; border: 1px solid var(--line); background: #fff; color: #000; }
.card:not(.violet):not(.yellow):not(.coral):not(.lime) input.field,
.card:not(.violet):not(.yellow):not(.coral):not(.lime) select.field { background: var(--card-2); color: var(--ink); }
label.lbl { display: block; font-weight: 600; font-size: 14px; margin: 0 0 7px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.bars .bar { display: grid; grid-template-columns: 110px 1fr 90px; gap: 14px; align-items: center; padding: 9px 0; }
.track { height: 16px; border-radius: 999px; background: rgba(0,0,0,.08); overflow: hidden; position: relative; }
.card:not(.violet):not(.yellow):not(.coral):not(.lime) .track { background: var(--card-2); }
.fill { height: 100%; border-radius: 999px; background: var(--violet); transform-origin: left; transform: scaleX(var(--v, 0));
        transition: transform 700ms var(--ease-out); }
.fill.black { background: #000; } .fill.coral { background: var(--coral); } .fill.yellow { background: #d9b800; } .fill.good { background: var(--good); }
.ci { position: absolute; top: 4px; height: 8px; border-left: 2px solid #000; border-right: 2px solid #000; }
.ci::after { content: ""; position: absolute; left: 0; right: 0; top: 3px; border-top: 2px solid #000; }
.empty { padding: 26px; text-align: center; color: var(--ink-3); }
.code { background: #000; color: #f3f3f6; border-radius: var(--r-inner); padding: 18px; max-height: 520px; overflow: auto; white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.55; }
.check { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; background: #000; color: #fff; flex: none; }
.check.bad { background: var(--bad); } .check.off { background: rgba(0,0,0,.25); }
.check svg { width: 14px; height: 14px; }
.opt { padding: 10px 16px; border-radius: 14px; border: 1px solid var(--line); background: #fff; color: #000; font-weight: 550;
       transition: transform 160ms var(--ease-out), border-color 200ms ease, background-color 200ms ease; }
.opt[aria-pressed="true"] { border-color: var(--violet); background: var(--violet-soft); color: #000; }
.timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.step { position: relative; padding-top: 44px; }
.step::before { content: ""; position: absolute; top: 15px; left: 34px; right: 6px; border-top: 2px solid var(--line); }
.step:last-child::before { display: none; }
.step .check { position: absolute; top: 2px; left: 0; width: 30px; height: 30px; background: var(--violet); }
.step b { display: block; }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; align-items: start; }
.col { border-radius: var(--r-card); padding: 26px 22px 140px; min-height: 560px; position: relative; overflow: hidden; }
.col .count { position: absolute; top: 26px; right: 22px; width: 34px; height: 34px; border-radius: 12px; background: rgba(255,255,255,.65);
              display: grid; place-items: center; font-weight: 700; }
.tcard { background: #fff; color: #000; border-radius: 22px; padding: 20px; margin-top: 14px; }
.tcard h3 { font-size: 19px; }
.col .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; pointer-events: none; }
.agentpill { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 16px; font-weight: 650; font-size: 14px; color: #000; }
.agentpill small { display: block; font-weight: 450; font-size: 12px; color: #2b2a36; }
.agentpill .mini { width: 34px; height: 30px; }
.menu { display: grid; gap: 4px; }
.menu button { text-align: left; padding: 14px 18px; border-radius: 16px; font-weight: 550; display: flex; gap: 12px; align-items: center;
               transition: background-color 200ms ease; }
.menu button svg { width: 22px; height: 22px; }
.menu button[aria-current="true"] { background: var(--violet-soft); font-weight: 700; box-shadow: inset 4px 0 0 var(--violet); }
.provider { display: grid; grid-template-columns: 1fr auto auto; gap: 18px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); }
.provider:last-child { border-bottom: 0; }

/* ---------- command bar ---------- */
/* part of the page, not floating: after the content, and pushed to the window bottom on short pages */
.command { position: relative; flex: none; margin: 20px auto 18px; width: min(1440px, calc(100% - 80px)); z-index: 2;
           display: flex; align-items: center; gap: 14px; background: var(--bar); color: var(--bar-ink); border-radius: 30px; padding: 12px 12px 12px 26px;
           }
.command .spark { width: 30px; height: 30px; flex: none; }
.command .sep { width: 2px; height: 34px; background: rgba(255,255,255,.25); flex: none; }
.command input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; font-size: 22px; color: #fff; padding: 8px 4px; }
.command input::placeholder { color: rgba(255,255,255,.55); }
.command .agents { display: flex; gap: 10px; }
.command .agentpill { padding: 7px 16px 7px 8px; min-width: 150px; }
.command .agentpill .dot { margin-left: auto; }
.go { width: 58px; height: 58px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; flex: none;
      transition: transform 160ms var(--ease-out); }
.go svg { width: 24px; height: 24px; }
.go:active { transform: scale(0.94); }

#toast { position: fixed; left: 50%; bottom: 28px; z-index: 30; padding: 13px 22px; border-radius: 999px; background: #000; color: #fff; font-weight: 600;
         opacity: 0; transform: translate(-50%, 16px); pointer-events: none; transition: opacity 400ms ease, transform 400ms ease; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#tip { position: fixed; z-index: 40; pointer-events: none; padding: 9px 12px; border-radius: 12px; background: #000; color: #fff; font-size: 13px;
       max-width: 300px; opacity: 0; transform: scale(0.97); transform-origin: top left; transition: opacity 125ms var(--ease-out), transform 125ms var(--ease-out); }
#tip.show { opacity: 1; transform: scale(1); }

/* ---------- characters ---------- */
.char { display: block; overflow: visible; color: #000; }
/* dark neutral cards: black characters would vanish, so they take the brand violet */
:root[data-theme="dark"] .card:not(.violet):not(.yellow):not(.coral):not(.lime) .char { color: var(--violet); }
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .card:not(.violet):not(.yellow):not(.coral):not(.lime) .char { color: var(--violet); }
}
.tcard .char, .agentpill .char { color: #000 !important; }
.char .body { transform-box: fill-box; transform-origin: 50% 90%; animation: bob var(--bob, 3.8s) ease-in-out infinite; animation-delay: var(--d, 0s); }
.char .eye { transform-box: fill-box; transform-origin: center; animation: blink var(--blink, 5.2s) infinite; animation-delay: var(--bd, 0s); }
.char .pupil { transition: transform 260ms var(--ease-out); }
.char .lines { transform-box: fill-box; transform-origin: 0% 100%; animation: lines 1.9s ease-in-out infinite; animation-delay: var(--d, 0s); }
.char.busy .body { --bob: 1.1s; }
.char.busy .lines { animation-duration: .8s; }
.char.alert .body { animation: wiggle 2.6s var(--ease-in-out) infinite; }
.char.sad .pupil { transform: translateY(2.5px); }
.char.sad .body { animation-duration: 6s; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-5px) rotate(1.5deg); } }
@keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-7deg); } 82% { transform: rotate(6deg); } 88% { transform: rotate(-3deg); } 94% { transform: rotate(2deg); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.12); } }
@keyframes lines { 0%, 100% { opacity: 1; transform: translate(0, 0) scale(1); } 50% { opacity: .35; transform: translate(2px, -2px) scale(.9); } }

/* ---------- entrance (first load only: one orchestrated moment) ---------- */
.enter .rise { opacity: 0; transform: translateY(14px); animation: rise 560ms var(--ease-out) forwards; animation-delay: calc(var(--i, 0) * 60ms + 120ms); }
.enter h1.hero .line > span { transform: translateY(105%); animation: lineup 700ms var(--ease-out) forwards; animation-delay: calc(var(--i, 0) * 80ms); }
@keyframes rise { to { opacity: 1; transform: translateY(0); } }
@keyframes lineup { to { transform: translateY(0); } }

/* tab change: view transition crossfade + short lift (spatial: new content arrives from below) */
::view-transition-old(page) { animation: vt-out 140ms ease both; }
::view-transition-new(page) { animation: vt-in 260ms var(--ease-out) both; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; }
@keyframes vt-out { to { opacity: 0; } }
@keyframes vt-in { from { opacity: 0; transform: translateY(10px); } }
.swap-in { animation: vt-in 260ms var(--ease-out) both; }

@media (prefers-reduced-motion: reduce) {
  .char .body, .char .lines, .char.alert .body { animation: none; }
  .char .eye { animation: blink 5.2s steps(1) infinite; }
  .enter .rise, .enter h1.hero .line > span { animation: fade 200ms ease forwards; transform: none; }
  ::view-transition-new(page), .swap-in { animation: fade 160ms ease both; }
  .fill { transition: none; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}

@media (max-width: 1180px) {
  .c3, .c4 { grid-column: span 6; } .c5, .c7, .c8 { grid-column: span 12; } .c6 { grid-column: span 12; }
  .kanban { grid-template-columns: 1fr 1fr; }
  .command .agents { display: none; }
}
@media (max-width: 760px) {
  .top { grid-template-columns: 1fr auto; padding: 16px 16px 4px; }
  .top .seg { display: none; }
  .logo { font-size: 24px; }
  .project { padding: 10px 12px; } .project span { display: none; }
  #refresh { display: none; }
  nav.tabs { max-width: calc(100% - 32px); }
  main { padding: 0 16px; }
  .c3, .c4, .c5, .c6, .c7, .c8, .c12 { grid-column: span 12; }
  .card { padding: 22px; }
  .kanban, .grid2, .timeline { grid-template-columns: 1fr; }
  .command { width: calc(100% - 32px); margin: 16px auto 12px; padding-left: 16px; }
  .command input { font-size: 17px; }
  .command .sep, .command .spark { display: none; }
  .bars .bar { grid-template-columns: 80px 1fr 70px; }
  .provider { grid-template-columns: 1fr; }
  #toast { bottom: 20px; }
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- icons -->
    <symbol id="i-studio" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="3"/><circle cx="17" cy="7" r="3"/><circle cx="7" cy="17" r="3"/><circle cx="17" cy="17" r="3"/></g></symbol>

  </defs>
</svg>

<header class="top">
  <div class="logo" aria-label="V/COMMAND">V/COMMAND</div>
  <div class="seg" id="groups" role="group" aria-label="Sections"><span class="pill" aria-hidden="true"></span></div>

    <div class="project" title=""><svg width="20" height="20"><use href="#i-cube"/></svg><span id="project">project</span></div>

<form class="command" id="command" autocomplete="off">
  <svg class="spark" aria-hidden="true"><use href="#i-spark"/></svg>
  <span class="sep" aria-hidden="true"></span>
  <label class="sr" for="cmd">Queue a task</label>
  <input id="cmd" name="goal" placeholder="What should we build next?" maxlength="500">

</form>
<div id="toast" role="status"></div>
<div id="tip" role="tooltip"></div>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)");
const FINE = matchMedia("(hover: hover) and (pointer: fine)");
const GROUPS = [
  ["Studio", ["studio", "mission", "agents", "queue"]],
  ["Activity", ["runs", "bench", "hardware"]],
  ["Library", ["memory", "context", "settings"]],
];
const TABS = {
  mission: ["Mission", "i-bench"], studio: ["Studio", "i-studio"], agents: ["Agents", "i-agents"], queue: ["Queue", "i-queue"], runs: ["Runs", "i-runs"],
  memory: ["Memory", "i-memory"], context: ["Context", "i-context"], bench: ["Benchmarks", "i-bench"],
  hardware: ["Hardware", "i-hw"], settings: ["Settings", "i-settings"],
};
const ORDER = ["studio", "mission", "agents", "queue", "runs", "memory", "context", "bench", "hardware", "settings"];
let STATE = null, LAST = "", TAB = "studio", RUN = null, SETTINGS = "connections", HW = null, FRAME = null;

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const usd = (v, d = 2) => v == null ? "unknown" : "$" + Number(v).toFixed(d);
const pct = (v) => Math.round(v * 100) + "%";
const icon = (id, cls = "") => `<svg class="ic ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const ago = (iso) => {
  if (!iso) return "";
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 90) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " d ago";
};

async function api(path, body) {
  const opts = { headers: { "X-VCMD-Token": TOKEN } };
  if (body !== undefined) { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  const type = res.headers.get("Content-Type") || "";
  const data = type.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800); }

/* ---------- characters ---------- */
const KINDS = ["builder", "checker", "challenger", "advisor"];
const COLOR = { builder: "violet", checker: "yellow", challenger: "coral", advisor: "lime" };
function kindFor(name, i) {
  if (/claude/i.test(name)) return "builder";
  if (/codex/i.test(name)) return "checker";
  if (/local|ollama|oss/i.test(name)) return "advisor";
  if (/opencode|deepseek/i.test(name)) return "challenger";
  return KINDS[i % 4];
}
const eyes = (cx, cy, gap = 13) => `
  <g class="eye" style="--bd:calc(var(--d,0s) * 1.7)"><ellipse cx="${cx}" cy="${cy}" rx="6.2" ry="8" fill="#fff"/><circle class="pupil" cx="${cx}" cy="${cy + 1}" r="3.3" fill="#000"/></g>
  <g class="eye" style="--bd:calc(var(--d,0s) * 1.7)"><ellipse cx="${cx + gap}" cy="${cy}" rx="6.2" ry="8" fill="#fff"/><circle class="pupil" cx="${cx + gap}" cy="${cy + 1}" r="3.3" fill="#000"/></g>`;
const LINES = (x, y) => `<g class="lines" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M${x} ${y}l5 -10"/><path d="M${x + 7} ${y + 8}l10 -4"/></g>`;
function character(kind, { size = 120, state = "", delay = 0, lines = true, label = "" } = {}) {
  const d = `style="--d:${delay}s"`;
  const a11y = label ? `role="img" aria-label="${esc(label)}"` : `aria-hidden="true"`;
  let body = "";
  if (kind === "builder") body = `<path d="M22 58c0-17 13-27 28-20 7 3 12 9 16 15 4 6 9 12 16 15 15 7 28-3 28-20" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round"/>
      <path d="M22 58c0 17 13 27 28 20 7-3 12-9 16-15 4-6 9-12 16-15 15-7 28 3 28 20" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round"/>
      <circle cx="44" cy="40" r="20" fill="currentColor"/>${eyes(37, 38)}`;
  else if (kind === "checker") body = `<rect x="28" y="18" width="66" height="62" rx="12" fill="currentColor" transform="rotate(-8 61 49)"/>${eyes(48, 44, 16)}`;
  else if (kind === "challenger") body = `<path d="M60 14c4 0 7 2 9 6l33 58c4 7-1 14-9 14H27c-8 0-13-7-9-14l33-58c2-4 5-6 9-6z" fill="currentColor"/>${eyes(52, 66)}`;
  else body = `<path d="M60 18c24 0 40 16 40 38s-14 34-40 34-40-12-40-34 16-38 40-38z" fill="currentColor"/>${eyes(48, 50, 16)}`;
  return `<svg class="char ${state}" ${a11y} viewBox="0 0 130 100" width="${size}" height="${size * 100 / 130}" ${d}>
    <g class="body">${body}</g>${lines ? LINES(kind === "challenger" ? 104 : 100, kind === "builder" ? 26 : 20) : ""}</svg>`;
}
function agentKinds() {
  const map = {};
  (STATE?.agents || []).forEach((a, i) => { map[a.name] = kindFor(`${a.name} ${a.argv || ""}`, i); });
  return map;
}
function agentState(a) {
  if (a.circuit === "open") return { cls: "sad", dot: "bad", text: "paused: provider failed" };
  if (a.installed === false) return { cls: "sad", dot: "", text: "not installed" };
  if (!a.runs) return { cls: "", dot: "good", text: "ready" };
  return { cls: "", dot: "good", text: `${a.verified}/${a.runs} verified` };
}

/* pupils follow the pointer (decorative; fine pointers only, never with reduced motion) */
let pointer = null, raf = 0;
document.addEventListener("pointermove", (e) => {
  if (!FINE.matches || REDUCED.matches) return;
  pointer = [e.clientX, e.clientY];
  if (!raf) raf = requestAnimationFrame(look);
});
function look() {
  raf = 0;
  if (!pointer) return;
  for (const svg of $$(".char:not(.sad)")) {
    const r = svg.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight) continue;
    const dx = pointer[0] - (r.left + r.width / 2), dy = pointer[1] - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy) || 1, k = Math.min(1, len / 240);
    const tx = (dx / len) * 2.6 * k, ty = (dy / len) * 3.2 * k;
    for (const p of svg.querySelectorAll(".pupil")) p.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px)`;
  }
}

/* ---------- small building blocks ---------- */
const hero = (...lines) => `<h1 class="hero">${lines.map((l, i) => `<span class="line"><span style="--i:${i}">${esc(l)}</span></span>`).join("")}</h1>`;
const badge = (text, kind = "") => `<span class="badge ${kind}"><span class="dot ${kind}"></span>${esc(text)}</span>`;
const checkIcon = (ok) => `<span class="check ${ok === false ? "bad" : ok == null ? "off" : ""}">${icon(ok === false ? "i-x" : "i-check")}</span>`;
function bar(label, value, max, text, fill = "", tip = "", ci = null) {
  const v = max > 0 ? Math.max(0, Math.min(1, value / max)) : 0;
  const ciEl = ci ? `<div class="ci" style="left:${ci[0] * 100}%;width:${(ci[1] - ci[0]) * 100}%"></div>` : "";
  return `<div class="bar" ${tip ? `data-tip="${esc(tip)}"` : ""}><div class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label)}</div>
    <div class="track"><div class="fill ${fill}" data-v="${v.toFixed(4)}"></div>${ciEl}</div><div class="num small" style="text-align:right">${esc(text)}</div></div>`;
}
const STATUS = {
  verified_by_configured_checks: ["Verified", "good"], failed_verification: ["Gates failed", "bad"], failed: ["Failed", "bad"],
  unverified: ["Unverified", "warn"], cancelled: ["Cancelled", ""],
};
const runStatus = (r) => r.cancelled ? STATUS.cancelled : (STATUS[r.status] || [r.status, ""]);

/* ---------- views ---------- */
function vStudio(s) {
  const k = s.kpi, t = s.task, kinds = agentKinds();
  const waiting = s.queue.filter((q) => q.status === "frozen");
  const approvals = s.workflow.approvals.filter((a) => a.status === "pending");
  const needs = waiting.length + approvals.length;
  const rate = k.runs ? k.verified / k.runs : null;
  return hero("Done isn't", "verified.") + `<div class="bento">
    <section class="card violet c7 rise" style="--i:0">
      <div class="between" style="align-items:flex-start">
        <div style="max-width:62%"><div class="kicker">Current task</div>
          <h2 class="big">${esc(t ? t.goal : "No active task")}</h2>
          <p style="margin-top:12px;font-size:17px">${t ? esc(t.next_step ? "Next: " + t.next_step : `${t.completed_steps.length} step(s) done`) : "Start one: vcmd task start \"goal\""}</p></div>
        ${character("builder", { size: 190, state: s.queue.some((q) => q.status === "running") ? "busy" : "", label: "Your crew" })}
      </div>
      <div class="inset" style="margin-top:24px"><div class="between"><b>Acceptance gates</b><span class="small muted">gates decide, not agents</span></div>
        <div class="stack" style="margin-top:10px">${s.frame.gates.map((g) => `<div class="row">${checkIcon(null)}<span class="mono">${esc(g)}</span></div>`).join("")
          || `<div class="muted">None configured. Results can only be "unverified".</div>`}</div></div>
    </section>
    <section class="card yellow c5 rise" style="--i:1">
      <div class="kicker">Verified rate</div>
      <div class="between"><div class="giant num" data-count="${rate == null ? "" : Math.round(rate * 100)}">${rate == null ? "—" : pct(rate)}</div>
        ${character("checker", { size: 130, delay: .6 })}</div>
      <p style="margin-top:10px;font-size:17px">${k.verified} of ${k.runs} run(s) passed every gate · ${k.failed} failed</p>
      <div class="bars" style="margin-top:18px">${bar("verified", k.verified, k.runs || 1, String(k.verified), "black")}${bar("failed", k.failed, k.runs || 1, String(k.failed), "coral")}</div>
    </section>
    <section class="card coral c4 rise" style="--i:2">
      <div class="between" style="align-items:flex-start"><div><div class="kicker">Needs you</div>
        <h2 class="big">${needs ? `${needs} decision${needs > 1 ? "s" : ""} waiting` : "Nothing waiting"}</h2></div>
        ${character("challenger", { size: 110, delay: 1.1, state: needs ? "alert" : "" })}</div>
      ${approvals.slice(0, 2).map((a) => `<div class="inset" style="margin-top:14px"><div class="between"><b>Approve ${esc(a.rule)}?</b><span class="small muted">${esc(a.agent || "")}</span></div>
        <div class="mono small" style="margin-top:6px;word-break:break-all">${esc(a.command)}</div>
        <div class="row" style="margin-top:10px;gap:8px"><button class="btn small" data-approve="${esc(a.id)}">Approve once</button><button class="btn ghost small" data-deny="${esc(a.id)}">Deny</button></div></div>`).join("")}
      ${waiting.slice(0, approvals.length ? 1 : 2).map((q) => `<div class="inset" style="margin-top:14px"><b>${esc(q.question)}</b><div class="small muted">${esc(q.goal)}</div></div>`).join("")}
      ${waiting.length ? `<button class="btn small" style="margin-top:16px" data-go="queue">Answer in Queue ${icon("i-arrow")}</button>` : approvals.length ? "" : `<p style="margin-top:12px">Agents ask here instead of guessing: questions, deploys, database writes, bulk deletes.</p>`}
    </section>
    <section class="card lime c4 rise" style="--i:3">
      <div class="kicker">Known spend</div><div class="giant num">${usd(k.known_cost_usd)}</div>
      <p style="margin-top:12px;font-size:16px">${k.unknown_cost_runs ? `${k.unknown_cost_runs} run(s) without a provider receipt. Unknown is not $0.` : "Every run has a provider receipt."}</p>
      ${s.budget.max_usd_per_task ? `<div class="badge" style="margin-top:14px">Budget per task ${usd(s.budget.max_usd_per_task)}</div>` : ""}
    </section>
    <section class="card c4 rise" style="--i:4">
      <div class="between"><h2>Latest runs</h2><button class="btn ghost small" data-go="runs">All runs</button></div>
      <div class="list" style="margin-top:8px">${s.runs.slice(0, 4).map((r) => { const [l, c] = runStatus(r); return `<div class="item between">
        <div><b>${esc(r.agent || "command")}</b><div class="small muted">${ago(r.created_at)} · ${r.duration_ms == null ? "session" : (r.duration_ms / 1000).toFixed(1) + " s"}</div></div>${badge(l, c)}</div>`; }).join("")
        || `<div class="empty">No runs yet. Try: vcmd run -- npm test</div>`}</div>
    </section>
  </div>`;
}

function vAgents(s) {
  const kinds = agentKinds();
  const used = s.agents.filter((a) => a.argv).sort((a, b) => (b.runs - a.runs) || (b.installed - a.installed));
  const cards = used.slice(0, 3).map((a, i) => {
    const kind = kinds[a.name], st = agentState(a);
    return `<section class="card ${COLOR[kind]} c4 rise" style="--i:${i}">
      <div class="between" style="align-items:flex-start"><div><h2 class="big">${esc(a.name)}</h2>
        <div style="margin-top:12px">${badge(st.text, st.dot)}</div></div>${character(kind, { size: 130, delay: i * .5, state: st.cls })}</div>
      <div class="inset" style="margin-top:22px"><div class="grid2">
        <div><div class="small muted">Runs</div><b class="num" style="font-size:24px">${a.runs}</b></div>
        <div><div class="small muted">Known spend</div><b class="num" style="font-size:24px">${!a.runs ? "—" : a.unknown_cost === a.runs ? "unknown" : usd(a.cost, 4)}</b></div></div>
        ${a.last_reason ? `<p class="small" style="margin-top:10px">Last provider issue: ${esc(a.last_reason)}</p>` : ""}</div>
      <button class="btn" style="margin-top:18px;width:100%" data-agent="${esc(a.name)}">Show command ${icon("i-arrow")}</button>
    </section>`;
  }).join("");
  const others = used.slice(3);
  const flow = used.slice(0, 3);
  return hero("Meet", "your crew.") + `<div class="bento">${cards}
    <section class="card c8 rise" style="--i:3"><h2>How they work together</h2>
      <p>Agents try in the order you list them. When the gates fail, the next agent gets the context frame with every failed approach — never the chat history.</p>
      <div class="row" style="margin-top:22px;flex-wrap:wrap">${flow.map((a, i) => `${i ? `<span class="badge" style="background:#000;color:#fff">${i === 1 ? "on failed gates" : "still failing"} ${icon("i-arrow")}</span>` : ""}
        <span class="agentpill" style="background:var(--${COLOR[kinds[a.name]]})">${character(kinds[a.name], { size: 40, lines: false, delay: i * .4 })}<span>${esc(a.name)}<small>attempt ${i + 1}</small></span></span>`).join("")}</div>
      <div class="code" style="margin-top:20px">vcmd agent ${flow.map((a) => esc(a.name)).join(" ")} --isolate</div>
    </section>
    <section class="card lime c4 rise" style="--i:4"><h2>Add agent</h2><p>Any CLI that takes a prompt can join the crew. Add it to <span class="mono">.vcommand/config.json</span>:</p>
      <div class="code" style="margin-top:14px">"agents": { "mine": ["my-cli", "run", "{prompt}"] }</div>
      ${others.length ? `<p class="small" style="margin-top:12px">Also configured: ${others.map((a) => esc(a.name)).join(", ")}</p>` : ""}
    </section>
    ${crewPanel(s, 5)}
    <section class="card c12 rise" id="agent-detail" style="--i:9"><h2>Commands</h2><div class="list">${used.map((a) => `<div class="item">
      <div class="between"><b>${esc(a.name)}</b><span class="small muted">${a.parser ? "output parser: " + esc(a.parser) : "no output parser"}${a.installed === false ? " · not installed" : ""}</span></div>
      <div class="mono muted" style="margin-top:6px;word-break:break-all">${esc(a.argv)}</div></div>`).join("")}</div></section>
  </div>`;
}

function vQueue(s) {
  const kinds = agentKinds();
  const by = (st) => s.queue.filter((q) => q.status === st);
  const ready = by("pending"), running = by("running"), frozen = by("frozen");
  const done = s.queue.filter((q) => ["done", "failed", "blocked"].includes(q.status));
  const tcard = (q, extra = "") => `<article class="tcard"><h3>${esc(q.goal)}</h3>
    <div class="small muted" style="margin-top:6px">${esc(q.id)}${q.after?.length ? " · after " + esc(q.after.join(", ")) : ""}${q.focus?.length ? " · " + esc(q.focus.join(", ")) : ""}</div>${extra}</article>`;
  return hero("Keep work", "moving.") + `<div class="kanban">
    <section class="col rise" style="--i:0;background:var(--violet-soft)"><h2 style="font-size:34px">Ready</h2><p class="muted">Queued and ready to run.</p>
      <span class="count">${ready.length}</span>${ready.map((q) => tcard(q)).join("") || `<div class="tcard muted">Nothing queued.</div>`}
      <div class="floor">${character("builder", { size: 150, delay: .2 })}</div></section>
    <section class="col rise" style="--i:1;background:var(--yellow)"><h2 style="font-size:34px">Running</h2><p>Agents are working.</p>
      <span class="count">${running.length}</span>${running.map((q) => tcard(q, `<div style="margin-top:12px">${badge("in progress", "warn")}</div>`)).join("") || `<div class="tcard muted">Start with: vcmd queue run claude --jobs 2</div>`}
      <div class="floor">${character("checker", { size: 150, delay: .7, state: running.length ? "busy" : "" })}</div></section>
    <section class="col rise" style="--i:2;background:var(--coral)"><h2 style="font-size:34px">Needs you</h2><p>Waiting for a decision.</p>
      <span class="count">${frozen.length}</span>${frozen.map((q) => tcard(q, `<p style="margin-top:12px;font-weight:650">${esc(q.question)}</p>
        <div class="row" style="flex-wrap:wrap;gap:8px;margin-top:10px">${(q.options || []).map((o) => `<button class="opt" data-answer="${esc(q.id)}" data-text="${esc(o)}">${esc(o)}</button>`).join("")}</div>
        <form class="answer row" data-id="${esc(q.id)}" style="margin-top:10px"><input class="field" name="text" placeholder="Or type your decision" required><button class="btn small">Answer</button></form>`)).join("")
        || `<div class="tcard muted">No open questions.</div>`}
      <div class="floor">${character("challenger", { size: 150, delay: 1.2, state: frozen.length ? "alert" : "" })}</div></section>
    <section class="col rise" style="--i:3;background:var(--lime)"><h2 style="font-size:34px">New task ${icon("i-up", "")}</h2><p>Turn an idea into work for the crew.</p>
      <form id="add-task" class="stack" style="margin-top:16px">
        <div><label class="lbl" for="t-goal">Goal</label><input class="field" id="t-goal" name="goal" required placeholder="Add multi-factor authentication to the login flow"></div>
        <div><label class="lbl" for="t-focus">Focus (optional)</label><input class="field" id="t-focus" name="focus" placeholder="src/auth.ts:login"></div>
        <div><label class="lbl" for="t-gate">Extra check (optional)</label><input class="field" id="t-gate" name="gate" placeholder="npm test"></div>
        <button class="btn" style="width:100%">Queue task ${icon("i-up")}</button></form>
      <div class="floor">${character("advisor", { size: 150, delay: .9 })}</div></section>
  </div>
  ${done.length ? `<section class="card rise" style="margin-top:18px;--i:4"><h2>Finished</h2><div class="list">${done.map((q) => `<div class="item between">
    <div><b>${esc(q.goal)}</b><div class="small muted">${esc(q.id)}${q.commit ? " · commit " + esc(q.commit) : ""}${q.note ? " · " + esc(q.note) : ""}</div></div>
    ${badge(q.status === "done" ? "verified & committed" : q.status, q.status === "done" ? "good" : q.status === "failed" ? "bad" : "")}</div>`).join("")}</div></section>` : ""}`;
}

function vRuns(s) {
  if (!s.runs.length) return hero("Every run,", "explained.") + `<div class="card empty">No runs yet. Try: vcmd run -- npm test</div>`;
  const kinds = agentKinds();
  const r = s.runs.find((x) => x.id === RUN) || s.runs[0];
  RUN = r.id;
  const [label, cls] = runStatus(r);
  const passed = r.checks.filter((c) => c.passed).length;
  const headline = r.cancelled ? "Cancelled: another agent won." : r.status === "verified_by_configured_checks" ? "Verified by configured checks."
    : r.status === "failed_verification" ? "The agent finished. The gates disagree." : r.status === "unverified" ? "Finished, but nothing checked it." : "The attempt failed.";
  const t0 = r.created_at ? new Date(r.created_at) : null;
  const at = (ms) => t0 ? new Date(t0.getTime() + ms).toLocaleTimeString() : "";
  const agentMs = r.duration_ms || 0, checksMs = r.checks.reduce((a, c) => a + (c.duration_ms || 0), 0);
  const steps = [["Started", at(0), r.external ? "Agent session ended" : "Run started", true],
                 ["Agent", at(agentMs), r.killed ? "Killed by the stream guard" : r.external ? "Interactive session" : `exit ${r.exit_code ?? "—"}`, !r.killed && !r.cancelled],
                 ["Checks", at(agentMs + checksMs), r.checks.length ? `${passed}/${r.checks.length} passed` : "skipped", r.checks.length ? passed === r.checks.length : null],
                 ["Result", "", label, cls === "good" ? true : cls === "bad" ? false : null]];
  return hero("Every run,", "explained.") + `<div class="bento">
    <section class="card c3 rise" style="--i:0"><h2>Recent runs</h2><div class="list" style="max-height:620px;overflow:auto;margin:6px -8px 0;padding:0 8px">
      ${s.runs.slice(0, 40).map((x) => { const [l, c] = runStatus(x); return `<button class="item" data-run="${esc(x.id)}" style="display:flex;gap:12px;align-items:center;width:100%;text-align:left;border-radius:16px;padding:12px 10px;${x.id === r.id ? "background:var(--violet-soft)" : ""}">
        ${character(kinds[x.agent] || "advisor", { size: 44, lines: false, delay: .3 })}<span style="flex:1;min-width:0"><b>${esc(x.agent || "command")}</b>
        <span class="small muted" style="display:block">${ago(x.created_at)}</span></span>${badge(l, c)}</button>`; }).join("")}</div></section>
    <section class="card violet c6 rise" style="--i:1"><div class="kicker">Run ${esc(r.id.slice(-8))}</div>
      <h2 class="big" style="max-width:12ch">${esc(headline)}</h2>
      <div class="between" style="margin-top:20px;align-items:flex-end;flex-wrap:wrap">
        <div class="row" style="flex-wrap:wrap">
          <div class="inset"><div class="small muted">Duration</div><b class="num" style="font-size:22px">${r.duration_ms == null ? "—" : (r.duration_ms / 1000).toFixed(1) + " s"}</b></div>
          <div class="inset"><div class="small muted">Known cost</div><b class="num" style="font-size:22px">${usd(r.cost, 4)}${r.estimated ? " est." : ""}</b></div>
          <div class="inset"><div class="small muted">Agent</div><b style="font-size:22px">${esc(r.agent || "command")}</b></div></div>
        ${character(kinds[r.agent] || "builder", { size: 150, state: cls === "bad" ? "sad" : "" })}</div>
      ${r.killed ? `<div class="inset" style="margin-top:14px"><b>Stream guard</b><p class="small">${esc(r.killed)}</p></div>` : ""}
      <div class="inset" style="margin-top:14px"><div class="between"><b>Changed files</b><span class="small muted">${r.isolated ? "isolated worktree" : "working tree"}</span></div>
        <div style="margin-top:8px">${r.changed.length ? r.changed.map((f) => `<span class="chip mono">${esc(f)}</span>`).join("") : `<span class="muted small">No file changes recorded.</span>`}</div></div>
    </section>
    <section class="card yellow c3 rise" style="--i:2"><div class="kicker">Checks</div>
      <div class="giant num">${r.checks.length ? `${passed}/${r.checks.length}` : "—"}</div><p style="font-size:17px;margin-top:6px">${r.checks.length ? "gates passed" : "no gates ran"}</p>
      <div class="stack" style="margin-top:16px">${r.checks.map((c) => `<div class="row" style="align-items:flex-start">${checkIcon(c.passed)}<span class="mono" style="word-break:break-all">${esc(c.cmd)}</span></div>`).join("")}</div>
    </section>
    ${r.cost == null ? `<section class="card coral c4 rise" style="--i:3"><div class="between" style="align-items:flex-start"><div><div class="kicker">Cost</div><h2>No receipt</h2></div>${character("challenger", { size: 90, delay: .5 })}</div>
      <p>This agent did not report a cost, so it is shown as unknown, never as $0. Use an agent template with an output parser to record it.</p></section>` : ""}
    <section class="card ${r.cost == null ? "c8" : "c12"} rise" style="--i:4"><h2>Run history</h2><div class="timeline" style="margin-top:18px">${steps.map(([n, t, d, ok]) => `<div class="step">
      <span class="check ${ok === false ? "bad" : ok == null ? "off" : ""}" style="${ok ? "" : ""}">${icon(ok === false ? "i-x" : "i-check")}</span><b>${esc(n)}</b>
      <span class="small muted">${esc(t)}</span><div class="small">${esc(d)}</div></div>`).join("")}</div></section>
  </div>`;
}

function vMemory(s) {
  return hero("Nothing learned", "is lost.") + `<div class="bento">
    <section class="card violet c5 rise" style="--i:0"><div class="between" style="align-items:flex-start"><div><div class="kicker">Ledger</div>
      <div class="giant num">${s.kpi.ledger}</div><p style="font-size:17px">failed approach${s.kpi.ledger === 1 ? "" : "es"} remembered</p></div>${character("builder", { size: 160 })}</div>
      <p style="margin-top:16px">Every failure becomes a hard constraint for the next agent. Entries with a pattern are enforced live by the stream guard.</p></section>
    <section class="card yellow c7 rise" style="--i:1"><h2>Pre-flight warnings</h2><p>Counted from this project's ledger, never estimated.</p>
      <div class="stack" style="margin-top:16px">${s.frame.hints.map((h) => `<div class="inset">${esc(h)}</div>`).join("") || `<div class="inset muted">Warnings appear once the ledger shows a repeated failure.</div>`}</div></section>
    <section class="card c12 rise" style="--i:2"><h2>Failed approaches</h2><div class="list">${s.ledger.map((e) => `<div class="item">
      <div class="between" style="align-items:flex-start"><div style="min-width:0"><b>${esc(e.tried)}</b><p class="small" style="margin-top:4px">${esc(e.failure)}</p>
        <div style="margin-top:8px">${(e.files || []).map((f) => `<span class="chip mono">${esc(f)}</span>`).join("")}${e.pattern ? `<span class="chip mono" style="background:var(--coral);color:#000">guard: ${esc(e.pattern)}</span>` : ""}</div></div>
        <span class="small muted" style="white-space:nowrap">${esc(e.agent || "")} · ${ago(e.created_at_utc)}</span></div></div>`).join("") || `<div class="empty">Nothing has failed yet.</div>`}</div></section>
    ${leaveBehind(s.workflow, 3)}
  </div>`;
}

function crewPanel(s, i) {
  const p = s.workflow.parallel, roles = Object.entries(s.workflow.roles || {});
  const names = [...new Set(p.sessions.filter((x) => x.status !== "ended").map((x) => x.name).concat(p.worktrees.map((w) => w.name)))];
  const dot = (st) => `<span class="badge ${st === "active" ? "good" : ""}">${esc(st)}</span>`;
  return `<section class="card violet c7 rise" style="--i:${i}"><div class="between"><div><div class="kicker">Live sessions</div><h2>${p.sessions.filter((x) => x.status === "active").length} active</h2></div>${character("advisor", { size: 110, state: p.sessions.some((x) => x.status === "active") ? "busy" : "" })}</div>
      <div class="list" style="margin-top:10px">${p.sessions.slice(0, 6).map((x) => `<div class="item between"><div><b>${esc(x.name)}</b><div class="small">${esc(x.agent)}${x.branch ? " · " + esc(x.branch) : ""} · ${ago(new Date(x.last_seen * 1000).toISOString())}</div></div>
        <span class="row" style="gap:6px">${x.unread ? `<span class="badge">${x.unread} unread</span>` : ""}${dot(x.status)}</span></div>`).join("") || `<div class="inset">Sessions appear once the hooks are installed: vcmd hooks install claude</div>`}</div>
      <form id="send-msg" class="row" style="margin-top:14px;gap:8px;flex-wrap:wrap"><select class="field" name="to" style="width:auto;min-width:120px"><option value="all">all</option>${names.map((n) => `<option>${esc(n)}</option>`).join("")}</select>
        <input class="field" name="text" placeholder="Short finding, warning or handoff" style="flex:1;min-width:160px" required><button class="btn small">Send</button></form></section>
    <section class="card ${p.conflicts.length ? "coral " : ""}c5 rise" style="--i:${i + 1}"><div class="kicker">Worktrees</div><h2>${p.conflicts.length ? `${p.conflicts.length} file collision${p.conflicts.length > 1 ? "s" : ""}` : "No collisions"}</h2>
      <div class="list" style="margin-top:8px">${p.worktrees.map((w) => `<div class="item between"><div><b>${esc(w.name)}</b><div class="small mono">${esc(w.branch)}</div></div><span class="small">${w.present ? (w.changed || []).length + " changed" : "missing"}</span></div>`).join("") || `<div class="inset">One worktree per live session: vcmd worktree new auth</div>`}
        ${p.conflicts.slice(0, 4).map((c) => `<div class="inset mono small">${esc(c.file)} · ${c.worktrees.map(esc).join(", ")}</div>`).join("")}</div></section>
    <section class="card yellow c6 rise" style="--i:${i + 2}"><div class="kicker">Roles</div><h2>One job per model</h2>
      <div class="list" style="margin-top:8px">${roles.map(([r, a]) => `<div class="item between"><b>${esc(r)}</b><span class="mono small">${esc(Array.isArray(a) ? a.join(", ") : String(a))}</span></div>`).join("") || `<div class="inset small">vcmd roles set plan claude-opus · build claude-sonnet · review codex · chore claude-haiku</div>`}</div></section>
    <section class="card c6 rise" style="--i:${i + 3}"><div class="between"><h2>Messages & channels</h2><span class="small muted">${p.channels.length ? p.channels.map((c) => esc(c.type)).join(" · ") : "no channels"}</span></div>
      <div class="list" style="margin-top:8px">${p.messages.slice(0, 5).map((m) => `<div class="item"><div class="small muted">${esc(m.from)} → ${esc(m.to)} · ${ago(m.at_utc)}</div><p class="small">${esc(m.text)}</p></div>`).join("") || `<div class="empty">No messages yet. Sessions talk with vcmd msg send.</div>`}</div>
      ${p.channels.length ? "" : `<div class="code" style="margin-top:12px">vcmd channel add telegram --chat &lt;id&gt;</div>`}</section>`;
}

function leaveBehind(wf, i) {
  const open = wf.todos.filter((t) => !t.done);
  return `<section class="card lime c7 rise" style="--i:${i}"><div class="between"><div><div class="kicker">Leave-behind</div><h2>handoff.md</h2></div><span class="small muted">rewritten after every run</span></div>
      <div class="code" style="margin-top:12px;white-space:pre-wrap">${esc(wf.handoff || "No handoff yet. It is written after the first run: vcmd run / vcmd agent / hooks.")}</div></section>
    <section class="card c5 rise" style="--i:${i + 1}"><div class="between"><h2>To-do</h2><span class="badge">${open.length} open</span></div>
      <div class="list" style="margin-top:8px">${wf.todos.slice(-12).map((t) => `<div class="item between"><span class="row">${checkIcon(t.done ? true : null)}<span${t.done ? ' class="muted" style="text-decoration:line-through"' : ""}>${esc(t.text)}</span></span>${t.done ? "" : `<button class="btn ghost small" data-todo-done="${t.n}">Done</button>`}</div>`).join("") || `<div class="empty">No open items. Agents add them with vcmd todo add.</div>`}</div>
      <form id="add-todo" class="row" style="margin-top:12px;gap:8px"><input class="field" name="text" placeholder="Add an item for the next session" style="flex:1;min-width:0" required><button class="btn small">Add</button></form></section>
    <section class="card c12 rise" style="--i:${i + 2}"><div class="between"><h2>Decisions</h2><span class="small muted">.vcommand/decisions.md · append-only</span></div>
      <div class="list" style="margin-top:8px">${wf.decisions.map((d) => `<div class="item"><p class="small">${esc(d)}</p></div>`).join("") || `<div class="empty">No decisions yet: vcmd decide "…" --why "…"</div>`}</div></section>`;
}

function vContext(s) {
  const f = s.frame, t = s.task, b = s.workflow.brief;
  const sources = [...f.symbols.map((x) => ({ name: x.symbol ? `${x.file}:${x.symbol}` : x.file, tag: x.symbol ? `lines ${x.lines?.[0]}–${x.lines?.[1]}` : `${x.outline} symbols` })),
                   ...(f.references.length ? [{ name: `${f.references.length} reference(s): tests, imports, uses`, tag: "blast radius" }] : []),
                   ...(f.constraints.length ? [{ name: `${f.constraints.length} lesson(s) from failed attempts`, tag: "ledger" }] : [])];
  return hero("Give every agent", "the full picture.") + `<div class="bento">
    <section class="card violet c5 rise" style="--i:0"><div class="between" style="align-items:flex-start"><div><div class="kicker">Context frame</div>
      <h2 class="big">${esc(t ? t.goal : "No active task")}</h2></div>${character("builder", { size: 150 })}</div>
      <div class="list" style="margin-top:18px">
        ${b ? `<div class="item"><h3>Scope</h3><p>${esc(b.scope)}</p></div>
        <div class="item"><h3>Done condition</h3><p>${esc(b.done)}</p></div>
        <div class="item"><h3>Leave behind</h3><p>${esc(b.leave_behind)}</p></div>` : ""}
        <div class="item"><h3>Next step</h3><p>${esc(t?.next_step || "Not set: the agent decides from the goal.")}</p></div>
        <div class="item"><h3>Constraints</h3>${(b?.constraints || []).concat(f.constraints).length ? (b?.constraints || []).concat(f.constraints).slice(0, 6).map((c) => `<p class="small" style="margin-top:4px">${esc(c)}</p>`).join("") : `<p>None yet.</p>`}</div>
        <div class="item"><h3>Acceptance checks</h3>${f.gates.length ? f.gates.map((g) => `<p class="mono" style="margin-top:4px">${esc(g)}</p>`).join("") : `<p>None configured.</p>`}</div></div></section>
    <section class="card c4 rise" style="--i:1"><h2>Included sources</h2><p>${sources.length} source${sources.length === 1 ? "" : "s"} in this frame${f.slice_parser ? ` · parsed with ${esc(f.slice_parser)}` : ""}</p>
      <div class="list" style="margin-top:10px">${sources.map((x) => `<div class="item between"><span class="row">${checkIcon(true)}<span class="mono" style="word-break:break-all">${esc(x.name)}</span></span><span class="badge good">${esc(x.tag)}</span></div>`).join("")
        || `<div class="empty">No focus set. Add one: vcmd task focus src/file.ts:Symbol</div>`}</div></section>
    <section class="card yellow c3 rise" style="--i:2"><div class="kicker">Ready to hand off</div><h2>Context is ready</h2>
      <p>Same state, same token. Any change to code, ledger or task makes a new one.</p>
      <div class="inset mono" style="margin-top:14px;word-break:break-all">${esc(f.token.slice(0, 23))}</div>
      <button class="btn" id="copy-frame" style="margin-top:16px;width:100%">Copy frame</button></section>
    ${f.problems.length ? `<section class="card coral c4 rise" style="--i:3"><div class="between" style="align-items:flex-start"><div><div class="kicker">Attention needed</div><h2>${f.problems.length} source${f.problems.length > 1 ? "s" : ""} need review</h2></div>${character("challenger", { size: 100, state: "alert" })}</div>
      ${f.problems.map((p) => `<div class="inset" style="margin-top:10px">${esc(p)}</div>`).join("")}</section>` : ""}
    <section class="card ${f.problems.length ? "c8" : "c12"} rise" style="--i:4"><div class="between"><h2>Frame preview</h2><span class="small muted">exactly what the next agent receives</span></div>
      <div class="code" id="frame-text" style="margin-top:12px">Loading…</div></section>
  </div>`;
}

function vBench(s) {
  if (!s.bench.length) return hero("Measured,", "not claimed.") + `<div class="card empty">No benchmark results yet. Try: vcmd bench benchmarks/ts200 --arm claude:plain --arm claude:frame</div>`;
  return hero("Measured,", "not claimed.") + s.bench.slice().reverse().map((b, bi) => {
    const arms = Object.entries(b.arms);
    const fillFor = (n) => n.endsWith(":frame") ? "coral" : "";
    const perRun = (a) => a.known_cost_usd == null ? null : a.known_cost_usd / Math.max(1, a.runs + (a.infra_errors || 0) - a.runs_with_unknown_cost);
    const maxCost = Math.max(...arms.map(([, a]) => perRun(a) || 0), 1e-9), maxWall = Math.max(...arms.map(([, a]) => a.median_wall_s || 0), 1e-9);
    const handoff = arms.filter(([, a]) => a.rescued !== undefined);
    const m = /^(\d{4}-\d{2}-\d{2})-(.+)$/.exec(b.suite);
    const title = m ? m[2].replaceAll("-", " ") : b.suite;
    return `<div class="bento" style="margin-bottom:18px">
      <section class="card violet c4 rise" style="--i:${bi * 3}"><div class="kicker">${esc(m ? m[1] : "benchmark")}</div>
        <h2 class="big" style="font-size:clamp(34px,3.4vw,52px);overflow-wrap:anywhere">${esc(title)}</h2>
        <p class="small mono" style="margin-top:8px;overflow-wrap:anywhere">${esc(b.source)}</p>
        <p style="margin-top:10px;font-size:17px">${b.tasks} tasks · ${b.results} runs</p>
        <div class="row" style="margin-top:16px;gap:10px;flex-wrap:wrap"><span class="badge"><span class="dot" style="background:var(--violet);outline:2px solid #000"></span>plain prompt</span>
          <span class="badge"><span class="dot" style="background:var(--coral)"></span>context frame</span></div>
        <div style="margin-top:14px">${character("checker", { size: 110, delay: bi * .3 })}</div></section>
      <section class="card c8 rise" style="--i:${bi * 3 + 1}"><h2>Pass rate</h2><p class="small muted">whisker = Wilson 95% interval${arms.some(([, a]) => a.infra_errors) ? " · provider errors excluded" : ""}</p>
        <div class="bars" style="margin-top:12px">${arms.map(([n, a]) => bar(n, a.pass_rate, 1, `${a.passed}/${a.runs}`, fillFor(n),
          `${n}: ${pct(a.pass_rate)} (95%: ${pct(a.wilson95[0])}–${pct(a.wilson95[1])})${a.infra_errors ? `, ${a.infra_errors} provider error(s) excluded` : ""}`, a.wilson95)).join("")}</div>
        <div class="grid2" style="margin-top:18px"><div><h3>Cost per run</h3><div class="bars">${arms.map(([n, a]) => bar(n, perRun(a) || 0, maxCost, perRun(a) == null ? "unknown" : usd(perRun(a), 4), fillFor(n))).join("")}</div></div>

  document.body.classList.remove("enter");
  try { localStorage.setItem("vcmd-tab", tab); } catch (_) {}
  if (push) history.replaceState(null, "", `?token=${encodeURIComponent(TOKEN)}#${tab}`);
  const run = () => { paint(); window.scrollTo({ top: 0 }); };
  if (document.startViewTransition && !REDUCED.matches) document.startViewTransition(run);
  else { run(); $("#main").classList.remove("swap-in"); void $("#main").offsetWidth; $("#main").classList.add("swap-in"); }
}
async function load(first = false) {
  try {
    const data = await api("/api/state");
    const key = JSON.stringify(data, (k, v) => k === "generated_at" ? undefined : v);
    STATE = data;
    if (first || key !== LAST) { LAST = key; paint(); if (first) countUp(); }
  } catch (e) {
    $("#main").innerHTML = hero("Can't reach", "the server.") + `<div class="card coral">${esc(e.message)}. Restart with vcmd dashboard.</div>`;
  }
}
async function loadFrame() {
  const el = $("#frame-text");
  if (!el) return;
  try { FRAME = await api("/api/frame"); el.textContent = FRAME; } catch (e) { el.textContent = e.message; }
}
async function loadHw() { try { HW = await api("/api/hw"); if (TAB === "hardware") paint(); } catch (e) { toast(e.message); } }
function countUp() {
  if (REDUCED.matches) return;
  $$("[data-count]").forEach((el) => {
    const target = Number(el.dataset.count);
    if (!el.dataset.count || !isFinite(target)) return;
    const t0 = performance.now(), dur = 900;
    const step = (t) => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4); el.textContent = Math.round(target * e) + "%"; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* ---------- events ---------- */
document.addEventListener("input", (e) => {
  if (e.target.dataset.share !== undefined) e.target.nextElementSibling.textContent = e.target.value + "%";
});
document.addEventListener("click", async (e) => {
  const el = e.target.closest("button");
  if (!el) return;
  try {
    if (el.dataset.mission) {
      const a = el.dataset.mission;
      if (a === "discard" && !confirm("Discard this mission?")) return;
      const q = (STATE.mission?.questions || []).some((x) => !x.answer);
      await missionCall(a, a === "approve" ? { skip_questions: q } : {});
      toast(a === "approve" ? "Approved. Nothing has run yet." : a === "run" ? "Mission started" : "Discarded");
    }
    else if (el.dataset.tab) show(el.dataset.tab);
    else if (el.dataset.group) show(GROUPS.find(([g]) => g === el.dataset.group)[1][0]);
    else if (el.dataset.go) show(el.dataset.go);
    else if (el.dataset.run) { RUN = el.dataset.run; if (document.startViewTransition && !REDUCED.matches) document.startViewTransition(paint); else paint(); }
    else if (el.dataset.settings) { SETTINGS = el.dataset.settings; paint(); if (SETTINGS === "keys") $("#k-value")?.focus(); }
    else if (el.dataset.connect) { SETTINGS = "keys"; paint(); $("#k-name").value = el.dataset.connect; $("#keyform").scrollIntoView({ behavior: REDUCED.matches ? "auto" : "smooth", block: "center" }); $("#k-value").focus(); }
    else if (el.dataset.delKey) { if (!confirm(`Remove ${el.dataset.delKey}?`)) return; await api("/api/secret/delete", { name: el.dataset.delKey }); toast(`Removed ${el.dataset.delKey}`); await load(); }
    else if (el.dataset.approve || el.dataset.deny) { const id = el.dataset.approve || el.dataset.deny; await api("/api/approval", { id, approve: !!el.dataset.approve }); toast(el.dataset.approve ? `Approved ${id} (this exact command, 24 h)` : `Denied ${id}`); await load(); }
    else if (el.dataset.todoDone) { await api("/api/todo/done", { n: el.dataset.todoDone }); toast("Marked done"); await load(); }
    else if (el.dataset.answer) { await api("/api/queue/answer", { id: el.dataset.answer, text: el.dataset.text }); toast("Answer saved. The task is back in the queue."); await load(); }
    else if (el.dataset.agent) { $("#agent-detail")?.scrollIntoView({ behavior: REDUCED.matches ? "auto" : "smooth" }); }
    else if (el.dataset.themeSet) { setTheme(el.dataset.themeSet); paint(); }
    else if (el.id === "copy-frame") { await navigator.clipboard.writeText(FRAME || await api("/api/frame")); toast("Frame copied"); }
    else if (el.id === "refresh") { HW = null; await load(true); toast("Updated"); }
    else if (el.id === "theme") { const dark = (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark"; setTheme(dark ? "light" : "dark"); }
  } catch (err) { toast(err.message); }
});
document.addEventListener("change", async (e) => {
  const t = e.target;
  try {
    if (t.dataset.share !== undefined) {
      const shares = {}; $$("[data-share]").forEach((r) => { shares[r.dataset.share] = Number(r.value); });
      if (!Object.values(shares).some((v) => v > 0)) { toast("Give at least one agent a share above 0"); await missionCall("update", {}); return; }
      await missionCall("update", { shares });
    } else if (t.dataset.pin !== undefined) await missionCall("update", { pin: { n: Number(t.dataset.pin), agent: t.value } });
    else if (t.id === "mission-budget") await missionCall("update", { budget: t.value === "" ? null : Number(t.value) });
  } catch (err) { toast(err.message); try { await missionCall("update", {}); } catch (_) {} }
  if (t.id === "k-name") $("#custom-wrap").style.display = e.target.value === "__custom" ? "block" : "none";
});
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, data = Object.fromEntries(new FormData(f));
  try {
    if (f.id === "mission-new") {
      const agents = new FormData(f).getAll("agents");
      $("#mission-create").disabled = true; $("#mission-wait").textContent = data.enhancer ? "Planning… this can take a minute" : "";
      try { await missionCall("new", { goal: data.goal, enhancer: data.enhancer || null, agents }); toast("Plan ready. Nothing runs until you approve."); }
      finally { const b = $("#mission-create"); if (b) b.disabled = false; }
    } else if (f.classList.contains("mission-answer")) {
      await missionCall("update", { answer: { n: Number(f.dataset.n), text: data.text } }); toast("Saved");
    } else if (f.id === "command") {
      if (!data.goal.trim()) return;
      const r = await api("/api/queue/add", { goal: data.goal.trim(), focus: [], gates: [] });
      f.reset(); toast(`Queued ${r.id}. Run it with vcmd queue run`); await load();
    } else if (f.id === "add-task") {
      const r = await api("/api/queue/add", { goal: data.goal, focus: data.focus ? [data.focus] : [], gates: data.gate ? [data.gate] : [] });
      toast(`Queued ${r.id}`); await load();
    } else if (f.classList.contains("answer")) {
      await api("/api/queue/answer", { id: f.dataset.id, text: data.text }); toast("Answer saved. The task is back in the queue."); await load();
    } else if (f.id === "send-msg") {
      await api("/api/msg", { to: data.to, text: data.text }); f.reset(); toast(`Message queued for ${data.to}`); await load();
    } else if (f.id === "add-todo") {
      await api("/api/todo/add", { text: data.text }); f.reset(); toast("Added to todo.md"); await load();
    } else if (f.id === "add-key") {
      const name = data.name === "__custom" ? (data.custom || "").trim() : data.name;
      const r = await api("/api/secret", { name, value: data.value });
      f.reset(); toast(`Saved ${r.name} (${r.hint})`); await load();
    }
  } catch (err) { toast(err.message); }
});
function setTheme(mode) {
  if (mode === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = mode;
  try { localStorage.setItem("vcmd-theme", mode); } catch (_) {}
}
document.addEventListener("mousemove", (e) => {
  const tip = $("#tip"), el = e.target.closest("[data-tip]");
  if (!el) { tip.classList.remove("show"); return; }
  tip.textContent = el.dataset.tip; tip.classList.add("show");
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + "px";
});
addEventListener("resize", syncNav);
addEventListener("hashchange", () => show(location.hash.slice(1), { push: false }));

/* ---------- boot ---------- */
try { const t = localStorage.getItem("vcmd-theme"); if (t && t !== "system") document.documentElement.dataset.theme = t; } catch (_) {}
buildNav();
try { TAB = location.hash.slice(1) || localStorage.getItem("vcmd-tab") || "studio"; } catch (_) { TAB = location.hash.slice(1) || "studio"; }
if (!VIEWS[TAB]) TAB = "studio";
load(true).then(() => document.fonts?.ready.then(syncNav));
setTimeout(() => document.body.classList.remove("enter"), 1600);
setInterval(() => { if (!document.hidden && !document.activeElement?.matches("input, textarea, select")) load(); }, 15000);
setInterval(() => { if (!document.hidden && STATE?.mission?.status === "running" && !document.activeElement?.matches("input, textarea, select")) load(); }, 3000);
</script>
</body>
</html>
