name: Test CLI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: vcmd demo --fast

  ts-suite:
    # benchmarks/ts200: every task must fail as generated and pass with its reference fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install package with the optional tree-sitter backend
        run: python -m pip install -e ".[ast]"
      - name: Code slice tests with tree-sitter
        run: python -m unittest tests.test_slice -v
      - name: Suite is reproducible from the generator
        run: |
          python scripts/gen_ts_suite.py /tmp/ts200
          diff -r /tmp/ts200 benchmarks/ts200
      - name: Every task fails unfixed and passes fixed
        env:
          VCMD_TS_SUITE: '1'
        run: python -m unittest tests.test_ts_suite -v
