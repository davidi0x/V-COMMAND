<rect width="1031" height="448" rx="8" fill="#0d1117"/>
<circle cx="18" cy="16" r="5" fill="#ff5f56"/><circle cx="34" cy="16" r="5" fill="#ffbd2e"/><circle cx="50" cy="16" r="5" fill="#27c93f"/>
<text class="l0" x="20" y="48" fill="#e6edf3">$ vcmd demo</text>
<text class="l1" x="20" y="68" fill="#79c0ff">V/COMMAND demo — Done isn't verified</text>
<text class="l2" x="20" y="88" fill="#c9d1d9">(scripted agents; real files, real checks, real ledger; no AI model called)</text>
<text class="l3" x="20" y="108" fill="#c9d1d9"></text>
<text class="l4" x="20" y="128" fill="#d2a8ff">[1] agent-a works on: Implement add(a, b) in calc.py</text>
<text class="l5" x="20" y="148" fill="#8b949e">      agent-a: implemented add() in calc.py. Task complete, all done!</text>
<text class="l6" x="20" y="168" fill="#79c0ff">V/  VERIFY     test_calc.py: add(2, 3) = -1, expected 5</text>
<text class="l7" x="20" y="188" fill="#ff7b72">V/  RESULT     FAIL -&gt; status: failed_verification</text>
<text class="l8" x="20" y="208" fill="#ff7b72">V/  NOTE       the agent said "done"; the check disagrees. Not verified.</text>
<text class="l9" x="20" y="228" fill="#79c0ff">V/  LEDGER     neg-4a0c4019: "agent-a: add() implemented as a - b" failed test_calc.py; next agents must not repeat it</text>
<text class="l10" x="20" y="248" fill="#c9d1d9"></text>
<text class="l11" x="20" y="268" fill="#d2a8ff">[2] handoff -&gt; agent-b with context frame sha256:4084bb3c8da2be5a</text>
<text class="l12" x="20" y="288" fill="#8b949e">      agent-b: received context frame, 1 failed approach(es) to avoid</text>
<text class="l13" x="20" y="308" fill="#8b949e">      agent-b: fixed add() in calc.py</text>
<text class="l14" x="20" y="328" fill="#79c0ff">V/  VERIFY     test_calc.py: add(2, 3) = 5, expected 5</text>
<text class="l15" x="20" y="348" fill="#3fb950">V/  RESULT     PASS -&gt; status: verified_by_configured_checks</text>
<text class="l16" x="20" y="368" fill="#c9d1d9"></text>
<text class="l17" x="20" y="388" fill="#c9d1d9">Evidence: 2 runs, 1 recorded failure, cost unknown (no provider receipt).</text>
<text class="l18" x="20" y="408" fill="#3fb950">Done isn't verified. Verified is verified.</text>
