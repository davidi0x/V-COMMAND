[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcommand-cli"
version = "0.2.0a1"
description = "Mission control for AI coding agents: approve the plan and cost range, tune who does what, verify with your own checks. Free, MIT, local-first."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "V/COMMAND Contributors"}]
keywords = ["ai", "coding-agent", "claude-code", "codex", "agents", "orchestration", "cost", "cli", "verification", "terminal"]

classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Environment :: Console", "Intended Audience :: Developers", "Topic :: Software Development :: Quality Assurance"]

[project.urls]
Homepage = "https://github.com/davidi0x/V-COMMAND"
Repository = "https://github.com/davidi0x/V-COMMAND"
Documentation = "https://github.com/davidi0x/V-COMMAND/blob/main/docs/MISSION.md"

[project.optional-dependencies]
ast = ["tree-sitter>=0.23", "tree-sitter-typescript>=0.23"]

[project.scripts]
vcmd = "vcommand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vcommand = ["*.html", "assets/*"]
